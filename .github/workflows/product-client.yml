name: Product Client Court

concurrency:
  group: product-client-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "apps/product-client/**"
      - "src/nolane_personal/product_*.py"
      - "src/nolane_personal/engine.py"
      - "src/nolane_personal/store.py"
      - "packaging/**"
      - "scripts/stage_product_release_assets.py"
      - "scripts/check_product_version.py"
      - "scripts/verify_windows_clean_install.ps1"
      - "tests/test_product_cortex_selftest.py"
      - "tests/test_product_prompt_payload.py"
      - "tests/test_product_version.py"
      - "src/nolane_personal/mobile_factorized.py"
      - "src/nolane_personal/mobile_prompt_contract.py"
      - "src/nolane_personal/seeded_sampling.py"
      - "src/nolane_personal/mobile_persistent_state.py"
      - "tests/test_seeded_sampling.py"
      - "tests/test_mobile_persistent_state.py"
      - "tests/test_mobile_factorized.py"
      - "tests/test_mobile_factorized_export.py"
      - "tests/test_mobile_prompt_contract.py"
      - "scripts/export_mobile_factorized.py"
      - "scripts/build_mobile_rust_fixture.py"
      - "scripts/build_real_mobile_tokenizer_fixture.py"
      - "scripts/build_synthetic_mobile_release_ceremony.py"
      - "scripts/stage_mobile_release_assets.py"
      - "scripts/build_mobile_release_bootstrap.py"
      - "scripts/freeze_mobile_release_prompt.py"
      - "scripts/verify_android_emulator_localchat.sh"
      - "crates/nolane-mobile-kernel/**"
      - "crates/nolane-mobile-runtime/**"
      - "tests/product_ui_browser.py"
      - "tests/test_product_runtime.py"
      - "tests/test_product_release_assets.py"
      - "tests/test_v1_closure.py"
      - "src/nolane_personal/v1_closure.py"
      - "scripts/evaluate_v1_closure.py"
      - "scripts/build_android_device_evidence.py"
      - "scripts/build_android_performance_evidence.py"
      - "scripts/collect_ci_v1_closure.py"
      - "config/v1-android-performance-policy.json"
      - ".github/workflows/v1-ci-closure.yml"
      - ".github/workflows/product-client.yml"
      - ".github/workflows/product-windows-release.yml"
      - ".github/workflows/product-android-release.yml"
      - "docs/V042-PRODUCT-CLIENT-NUI-CONTRACT.md"
      - "docs/V042-NUI-CRITIQUE-LEDGER.md"
      - "docs/ROADMAP.md"
      - "README.md"
  pull_request:
    paths:
      - "apps/product-client/**"
      - "src/nolane_personal/product_*.py"
      - "src/nolane_personal/engine.py"
      - "src/nolane_personal/store.py"
      - "packaging/**"
      - "scripts/stage_product_release_assets.py"
      - "scripts/check_product_version.py"
      - "scripts/verify_windows_clean_install.ps1"
      - "tests/test_product_cortex_selftest.py"
      - "tests/test_product_prompt_payload.py"
      - "tests/test_product_version.py"
      - "src/nolane_personal/mobile_factorized.py"
      - "src/nolane_personal/mobile_prompt_contract.py"
      - "src/nolane_personal/seeded_sampling.py"
      - "src/nolane_personal/mobile_persistent_state.py"
      - "tests/test_seeded_sampling.py"
      - "tests/test_mobile_persistent_state.py"
      - "tests/test_mobile_factorized.py"
      - "tests/test_mobile_factorized_export.py"
      - "tests/test_mobile_prompt_contract.py"
      - "scripts/export_mobile_factorized.py"
      - "scripts/build_mobile_rust_fixture.py"
      - "scripts/build_real_mobile_tokenizer_fixture.py"
      - "scripts/build_synthetic_mobile_release_ceremony.py"
      - "scripts/stage_mobile_release_assets.py"
      - "scripts/build_mobile_release_bootstrap.py"
      - "scripts/freeze_mobile_release_prompt.py"
      - "scripts/verify_android_emulator_localchat.sh"
      - "crates/nolane-mobile-kernel/**"
      - "crates/nolane-mobile-runtime/**"
      - "tests/product_ui_browser.py"
      - "tests/test_product_runtime.py"
      - "tests/test_product_release_assets.py"
      - "tests/test_v1_closure.py"
      - "src/nolane_personal/v1_closure.py"
      - "scripts/evaluate_v1_closure.py"
      - "scripts/build_android_device_evidence.py"
      - "scripts/build_android_performance_evidence.py"
      - "scripts/collect_ci_v1_closure.py"
      - "config/v1-android-performance-policy.json"
      - ".github/workflows/v1-ci-closure.yml"
      - ".github/workflows/product-client.yml"
      - ".github/workflows/product-windows-release.yml"
      - ".github/workflows/product-android-release.yml"
      - "docs/V042-PRODUCT-CLIENT-NUI-CONTRACT.md"
      - "docs/V042-NUI-CRITIQUE-LEDGER.md"
      - "docs/ROADMAP.md"
      - "README.md"

jobs:
  runtime:
    name: Product runtime court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_product_runtime.py tests/test_product_release_assets.py tests/test_product_learning_workspace.py tests/test_product_cortex_selftest.py tests/test_product_version.py tests/test_mobile_factorized.py tests/test_mobile_factorized_export.py tests/test_mobile_prompt_contract.py tests/test_product_prompt_payload.py tests/test_seeded_sampling.py tests/test_mobile_persistent_state.py tests/test_v1_closure.py
      - run: python scripts/check_product_version.py
      - run: python -m compileall -q src/nolane_personal/product_*.py src/nolane_personal/mobile_factorized.py src/nolane_personal/mobile_prompt_contract.py src/nolane_personal/seeded_sampling.py src/nolane_personal/mobile_persistent_state.py src/nolane_personal/v1_closure.py scripts/stage_product_release_assets.py scripts/check_product_version.py scripts/export_mobile_factorized.py scripts/build_real_mobile_tokenizer_fixture.py scripts/evaluate_v1_closure.py scripts/build_android_device_evidence.py scripts/build_android_performance_evidence.py scripts/collect_ci_v1_closure.py packaging/product_runtime_entry.py

  browser:
    name: NUI browser court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/product_ui_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-ui-render-evidence
          if-no-files-found: warn
          path: artifacts/product-ui/*.png

  windows-native:
    name: Windows native host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse Windows clean-install court script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/verify_windows_clean_install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Windows clean-install court PowerShell syntax invalid"
          }
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0
      - name: Generate product icons
        working-directory: apps/product-client
        shell: pwsh
        run: tauri icon icon-source.svg
      - name: Build Windows app executable
        working-directory: apps/product-client
        shell: pwsh
        run: tauri build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nolane-v1-windows-native
          if-no-files-found: error
          path: apps/product-client/src-tauri/target/release/nolane-product-client.exe

  mobile-native:
    name: Android native kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install neural export dependencies
        run: python -m pip install -e '.[product]'
      - name: Build deterministic Python mobile golden
        run: python scripts/build_mobile_rust_fixture.py --output-dir artifacts/mobile-rust-fixture
      - name: Build synthetic L36 mobile release ceremony
        run: |
          python scripts/build_synthetic_mobile_release_ceremony.py \
            --mobile-package-dir artifacts/mobile-rust-fixture/package \
            --output artifacts/mobile-release-court/promotion-ceremony.json
      - name: Stage authority-bound LocalMobile release bundle
        run: |
          python scripts/stage_mobile_release_assets.py \
            --mobile-package-dir artifacts/mobile-rust-fixture/package \
            --tokenizer-dir artifacts/mobile-rust-fixture \
            --prompt-contract artifacts/mobile-rust-fixture/prompt-contract.json \
            --bootstrap-state artifacts/mobile-rust-fixture/bootstrap-state.json \
            --ceremony artifacts/mobile-release-court/promotion-ceremony.json \
            --resources artifacts/mobile-release-staged
      - name: Strict L36 LocalMobile release authority court
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_authorized_localmobile_release -- artifacts/mobile-release-staged
      - name: Rust mobile kernel unit tests
        run: cargo test --manifest-path crates/nolane-mobile-kernel/Cargo.toml
      - name: Cross-language logits/state equivalence
        run: cargo run --quiet --manifest-path crates/nolane-mobile-kernel/Cargo.toml --example verify_fixture -- artifacts/mobile-rust-fixture
      - name: Native tokenizer/generation unit tests
        run: cargo test --manifest-path crates/nolane-mobile-runtime/Cargo.toml
      - name: Cross-language tokenizer/greedy generation equivalence
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_generation_fixture -- artifacts/mobile-rust-fixture
      - name: Cross-language seeded nucleus sampling equivalence
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_seeded_generation_fixture -- artifacts/mobile-rust-fixture
      - name: Python to Rust persistent mobile state bridge
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_persistent_state_fixture -- artifacts/mobile-rust-fixture
      - name: LocalMobile product API and restart continuity
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_localmobile_product -- artifacts/mobile-rust-fixture
      - name: LocalMobile lifecycle parity and restart court
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_localmobile_lifecycle -- artifacts/mobile-rust-fixture
      - name: Frozen prompt -> native chat generation equivalence
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_chat_generation_fixture -- artifacts/mobile-rust-fixture
      - name: Freeze exact pinned Qwen tokenizer fixture
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/build_real_mobile_tokenizer_fixture.py --output-dir artifacts/real-qwen-tokenizer
      - name: Exact pinned Qwen tokenizer Rust compatibility
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_real_qwen_tokenizer -- artifacts/real-qwen-tokenizer
      - name: Exact pinned Qwen product-prompt parity
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_real_qwen_prompt -- artifacts/real-qwen-tokenizer
      - name: Dynamic product payload -> pinned Qwen prompt parity
        run: cargo run --quiet --manifest-path crates/nolane-mobile-runtime/Cargo.toml --example verify_product_payload_fixture -- artifacts/real-qwen-tokenizer
      - name: Android target compile court
        run: |
          cargo check --manifest-path crates/nolane-mobile-kernel/Cargo.toml --target aarch64-linux-android
          cargo check --manifest-path crates/nolane-mobile-runtime/Cargo.toml --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: v058-localmobile-court-bundle
          if-no-files-found: error
          path: artifacts/mobile-release-staged/**

  android-emulator-apk:
    name: Android x86_64 emulator APK
    needs: mobile-native
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: actions/download-artifact@v4
        with:
          name: v058-localmobile-court-bundle
          path: apps/product-client/src-tauri/resources/mobile
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0
      - name: Build packaged x86_64 emulator APK
        working-directory: apps/product-client
        shell: bash
        run: |
          tauri icon icon-source.svg
          tauri android init --ci --skip-targets-install
          python ../../scripts/patch_tauri_android_cli_bridge.py src-tauri/gen/android
          tauri icon icon-source.svg
          # Emulator evidence needs an installable APK. The release court stays
          # separate; use Android's standard debug signing only for this CI APK.
          tauri android build --debug --apk --target x86_64
      - name: Verify x86_64 APK exists
        shell: bash
        run: |
          test -n "$(find apps/product-client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: v058-emulator-apk
          if-no-files-found: error
          path: apps/product-client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  android-emulator:
    name: Android emulator local-chat restart court
    needs: android-emulator-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v058-emulator-apk
          path: artifacts/v058-emulator-apk
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Emulator boot + packaged LocalMobile restart court
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify_android_emulator_localchat.sh artifacts/v058-emulator-apk

  android:
    name: Android APK court
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0
      - name: Build Android APK
        working-directory: apps/product-client
        shell: bash
        run: |
          tauri icon icon-source.svg
          tauri android init --ci --skip-targets-install
          python ../../scripts/patch_tauri_android_cli_bridge.py src-tauri/gen/android
          tauri icon icon-source.svg
          tauri android build --apk --target aarch64
      - name: Verify APK exists
        shell: bash
        run: |
          test -n "$(find apps/product-client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: nolane-v1-android-arm64-apk
          if-no-files-found: error
          path: apps/product-client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
