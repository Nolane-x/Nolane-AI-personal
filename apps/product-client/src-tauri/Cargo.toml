[package]
name = "nolane-product-client"
version = "0.58.0"
description = "Minimal Windows and Android client for Nolane AI Personal"
authors = ["Nolane"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nolane_product_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nolane-product-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
portpicker = "0.1"
rand = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
nolane-mobile-runtime = { path = "../../../crates/nolane-mobile-runtime" }
android_logger = "0.14"
log = "0.4"
tauri-plugin-fs = "2"
