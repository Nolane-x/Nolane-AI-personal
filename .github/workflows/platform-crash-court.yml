name: Platform Crash Court

on:
  push:
  pull_request:

jobs:
  hard-kill:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_promotion_authority.py
          tests/test_unified_promotion_authority.py
          -k "l37 or l41_hard_kill"
      - run: python -m compileall -q src scripts
