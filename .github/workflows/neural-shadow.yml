name: Neural Shadow CI

on:
  push:
  pull_request:

jobs:
  neural-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "transformers>=4.51,<5"
      - run: >-
          pytest -q
          tests/test_living_core_contracts.py
          tests/test_neural_shadow.py
          tests/test_surgery.py
          tests/test_surgery_candidate.py
          tests/test_surgery_court.py
          tests/test_qwen3_surgery_contract.py
          tests/test_personal_cortex_training.py
          tests/test_recurrent_cortex.py
          tests/test_recurrent_state.py
          tests/test_depth_bridge.py
          tests/test_block_replacement.py
          tests/test_progressive_replacement.py
          tests/test_recurrent_islands.py
          tests/test_state_space_cortex.py
          tests/test_shrinking_scaffold.py
      - run: python scripts/audit_living_core.py
      - run: python scripts/audit_state_space_cortex.py
      - run: python scripts/audit_multiscale_cortex.py
