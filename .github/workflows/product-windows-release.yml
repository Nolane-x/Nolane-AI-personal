name: Windows Product Release

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "HTTPS URL for the promoted factorized-nolane.pt"
        required: true
        type: string
      model_sha256:
        description: "Exact SHA-256 from the approved release candidate"
        required: true
        type: string
      ceremony_url:
        description: "HTTPS URL for its COMPLETE L36 promotion ceremony JSON"
        required: true
        type: string
      tokenizer_zip_url:
        description: "HTTPS URL for tokenizer assets zip"
        required: true
        type: string
      tokenizer_zip_sha256:
        description: "SHA-256 of tokenizer zip"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release URLs
        shell: pwsh
        run: |
          @(
            "${{ inputs.model_url }}",
            "${{ inputs.ceremony_url }}",
            "${{ inputs.tokenizer_zip_url }}"
          ) | ForEach-Object {
            $uri = [Uri]$_
            if ($uri.Scheme -ne "https") {
              throw "Release assets must use HTTPS: $_"
            }
          }

      - name: Download release evidence and assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-input | Out-Null
          Invoke-WebRequest -Uri "${{ inputs.model_url }}" -OutFile release-input/factorized-nolane.pt
          Invoke-WebRequest -Uri "${{ inputs.ceremony_url }}" -OutFile release-input/promotion-ceremony.json
          Invoke-WebRequest -Uri "${{ inputs.tokenizer_zip_url }}" -OutFile release-input/tokenizer.zip

          $tokenizerHash = (Get-FileHash release-input/tokenizer.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tokenizerHash -ne "${{ inputs.tokenizer_zip_sha256 }}".ToLowerInvariant()) {
            throw "Tokenizer archive SHA-256 mismatch"
          }
          Expand-Archive -Path release-input/tokenizer.zip -DestinationPath release-input/tokenizer -Force

      - name: Verify product version consistency
        shell: pwsh
        run: |
          $versions = python scripts/check_product_version.py | ConvertFrom-Json
          "PRODUCT_VERSION=$($versions.python)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install product runtime build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[product]"
          python -m pip install pyinstaller

      - name: Build self-contained Windows runtime
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm packaging/nolane-product-runtime.spec
          if (-not (Test-Path dist/nolane-product-runtime/nolane-product-runtime.exe)) {
            throw "PyInstaller runtime executable missing"
          }

      - name: Stage authority-bound installer resources
        shell: pwsh
        run: |
          python scripts/stage_product_release_assets.py `
            --runtime-dir dist/nolane-product-runtime `
            --model release-input/factorized-nolane.pt `
            --model-sha256 "${{ inputs.model_sha256 }}" `
            --tokenizer-dir release-input/tokenizer `
            --tokenizer-archive-sha256 "${{ inputs.tokenizer_zip_sha256 }}" `
            --ceremony release-input/promotion-ceremony.json

      - name: Full local inference smoke
        shell: pwsh
        run: |
          $token = ([Guid]::NewGuid().ToString("N") + [Guid]::NewGuid().ToString("N"))
          $port = 46831
          $runtime = Resolve-Path "apps/product-client/src-tauri/resources/runtime/nolane-product-runtime.exe"
          $model = Resolve-Path "apps/product-client/src-tauri/resources/model"
          $tokenizer = Resolve-Path "apps/product-client/src-tauri/resources/tokenizer"
          $ceremony = Resolve-Path "apps/product-client/src-tauri/resources/model/promotion-ceremony.json"
          $data = Join-Path $env:RUNNER_TEMP "nolane-product-smoke"

          $args = @(
            "--host", "127.0.0.1",
            "--port", "$port",
            "--data-dir", "$data",
            "--model-bundle", "$model",
            "--tokenizer", "$tokenizer",
            "--ceremony", "$ceremony",
            "--device", "cpu",
            "--auth-token", "$token"
          )
          $process = Start-Process -FilePath $runtime -ArgumentList $args -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v1/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) {
                throw "Bundled runtime exited during startup"
              }
            }
            if (-not $ready) {
              throw "Bundled runtime did not become ready"
            }

            $headers = @{ "X-Nolane-Token" = $token }
            $power = Invoke-RestMethod `
              -Method Post `
              -Uri "http://127.0.0.1:$port/v1/power" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body '{"enabled":true}' `
              -TimeoutSec 120
            if ($power.phase -ne "on") {
              throw "Nolane model failed to power on"
            }

            Invoke-RestMethod `
              -Method Put `
              -Uri "http://127.0.0.1:$port/v1/profile" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body '{"response_length":"compact","language":"vi"}' | Out-Null

            $chat = Invoke-RestMethod `
              -Method Post `
              -Uri "http://127.0.0.1:$port/v1/chat" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body '{"text":"Chỉ trả lời ngắn gọn: xin chào."}' `
              -TimeoutSec 180
            if ([string]::IsNullOrWhiteSpace($chat.reply)) {
              throw "Nolane inference smoke returned an empty reply"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install pinned Tauri CLI
        shell: pwsh
        run: npm install --global @tauri-apps/cli@2.12.0

      - name: Generate product icons
        working-directory: apps/product-client
        shell: pwsh
        run: tauri icon icon-source.svg

      - name: Build one-click NSIS installer
        working-directory: apps/product-client
        shell: pwsh
        run: tauri build --bundles nsis

      - name: Verify release outputs
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps/product-client/src-tauri/target/release/bundle/nsis/*.exe" `
            | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          if (-not (Test-Path "apps/product-client/src-tauri/resources/release-assets.json")) {
            throw "release-assets.json missing"
          }

      - name: Clean-install packaged product court
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps/product-client/src-tauri/target/release/bundle/nsis/*.exe" `
            | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "nolane-clean-install"
          $receipt = Join-Path $env:RUNNER_TEMP "nolane-clean-install-receipt.json"
          & scripts/verify_windows_clean_install.ps1 `
            -Installer $installer.FullName `
            -InstallDir $installDir `
            -ExpectedVersion $env:PRODUCT_VERSION `
            -ReceiptPath $receipt

      - uses: actions/upload-artifact@v4
        with:
          name: nolane-windows-release
          if-no-files-found: error
          path: |
            apps/product-client/src-tauri/target/release/bundle/nsis/*.exe
            apps/product-client/src-tauri/resources/release-assets.json
            ${{ runner.temp }}/nolane-clean-install-receipt.json
