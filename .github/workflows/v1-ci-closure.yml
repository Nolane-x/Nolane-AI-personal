name: V1 CI Closure

on:
  workflow_run:
    workflows: ["Product Client Court"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  closure:
    name: Same-SHA CI software closure
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install closure verifier
        run: python -m pip install -e '.[dev]'

      - name: Re-court closure semantics
        run: python -m pytest -q tests/test_v1_closure.py

      - name: Resolve current product version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("apps/product-client/package.json").read_text())["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Collect same-SHA workflow and job evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/collect_ci_v1_closure.py \
            --repository "${{ github.repository }}" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --product-run-id "${{ github.event.workflow_run.id }}" \
            --product-version "${{ steps.version.outputs.version }}" \
            --wait-seconds 1200 \
            --poll-seconds 20 \
            --output artifacts/v1-ci-closure.json

      - name: Show closure receipt
        run: cat artifacts/v1-ci-closure.json

      - uses: actions/upload-artifact@v4
        with:
          name: v1-ci-closure-${{ github.event.workflow_run.head_sha }}
          if-no-files-found: error
          path: artifacts/v1-ci-closure.json
