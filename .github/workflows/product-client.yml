name: Product Client Court

on:
  push:
    paths:
      - "apps/product-client/**"
      - "src/nolane_personal/product_*.py"
      - "src/nolane_personal/engine.py"
      - "src/nolane_personal/store.py"
      - "packaging/**"
      - "scripts/stage_product_release_assets.py"
      - "tests/product_ui_browser.py"
      - "tests/test_product_runtime.py"
      - "tests/test_product_release_assets.py"
      - ".github/workflows/product-client.yml"
  pull_request:
    paths:
      - "apps/product-client/**"
      - "src/nolane_personal/product_*.py"
      - "src/nolane_personal/engine.py"
      - "src/nolane_personal/store.py"
      - "packaging/**"
      - "scripts/stage_product_release_assets.py"
      - "tests/product_ui_browser.py"
      - "tests/test_product_runtime.py"
      - "tests/test_product_release_assets.py"
      - ".github/workflows/product-client.yml"

jobs:
  runtime:
    name: Product runtime court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_product_runtime.py tests/test_product_release_assets.py
      - run: python -m compileall -q src/nolane_personal/product_*.py scripts/stage_product_release_assets.py packaging/product_runtime_entry.py

  browser:
    name: NUI browser court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/product_ui_browser.py

  windows-native:
    name: Windows native host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows app executable
        working-directory: apps/product-client
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2.12" --locked
          cargo tauri build --no-bundle

  android:
    name: Android APK court
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build Android APK
        working-directory: apps/product-client
        shell: bash
        run: |
          cargo install tauri-cli --version "^2.12" --locked
          cargo tauri android init --ci --skip-targets-install
          cargo tauri android build --apk --target aarch64
      - name: Verify APK exists
        shell: bash
        run: |
          test -n "$(find apps/product-client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f -print -quit)"
