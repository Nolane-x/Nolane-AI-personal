name: Publish GitHub Release

on:
  workflow_run:
    workflows: ["Windows Software Installer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Verified commit SHA to publish. Defaults to the current main SHA."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-github-release.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Evidence-gated GitHub release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve verified release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              SHA="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
              WINDOWS_RUN_ID="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              SHA="$(jq -r '.inputs.release_sha // empty' "$GITHUB_EVENT_PATH")"
              if [ -z "$SHA" ]; then
                SHA="$GITHUB_SHA"
              fi
              WINDOWS_RUN_ID=""
              ;;
            push)
              SHA="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
              WINDOWS_RUN_ID=""
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA is not a full commit SHA: $SHA" >&2
            exit 1
          fi

          if [ -z "$WINDOWS_RUN_ID" ]; then
            RUNS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100")"
            WINDOWS_RUN_ID="$(jq -r '
              [.workflow_runs[]
               | select(.name == "Windows Software Installer")
               | select(.event == "push")
               | select(.head_branch == "main")
               | select(.conclusion == "success")]
              | sort_by(.id)
              | last
              | .id // empty
            ' <<<"$RUNS")"
          fi

          if [ -z "$WINDOWS_RUN_ID" ]; then
            echo "No successful Windows Software Installer run found for $SHA" >&2
            exit 1
          fi

          CLOSURE_RUN_ID=""
          for _ in $(seq 1 60); do
            RUNS="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100")"
            CLOSURE_RUN_ID="$(jq -r '
              [.workflow_runs[]
               | select(.name == "V1 CI Closure")
               | select(.head_branch == "main")
               | select(.conclusion == "success")]
              | sort_by(.id)
              | last
              | .id // empty
            ' <<<"$RUNS")"
            if [ -n "$CLOSURE_RUN_ID" ]; then
              break
            fi
            sleep 20
          done

          if [ -z "$CLOSURE_RUN_ID" ]; then
            echo "No successful same-SHA V1 CI Closure found for $SHA" >&2
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "windows_run_id=$WINDOWS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "closure_run_id=$CLOSURE_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Resolve version and enforce release identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("apps/product-client/package.json").read_text())["version"])
          PY
          )"
          TAG="v$VERSION"
          SHA="${{ steps.candidate.outputs.sha }}"

          python scripts/check_product_version.py

          if gh release view "$TAG" >/dev/null 2>&1; then
            TARGET="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')"
            if [ "$TARGET" != "$SHA" ]; then
              echo "Release $TAG already exists and does not target $SHA (target=$TARGET)" >&2
              exit 1
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download verified Windows installer evidence
        if: steps.meta.outputs.release_exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: nolane-windows-setup-${{ steps.candidate.outputs.sha }}
          path: release-input/windows
          run-id: ${{ steps.candidate.outputs.windows_run_id }}
          github-token: ${{ github.token }}

      - name: Download same-SHA software closure bundle
        if: steps.meta.outputs.release_exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: nolane-v1-software-artifacts-${{ steps.candidate.outputs.sha }}
          path: release-input/closure
          run-id: ${{ steps.candidate.outputs.closure_run_id }}
          github-token: ${{ github.token }}

      - name: Assemble public release assets
        if: steps.meta.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.candidate.outputs.sha }}"

          mkdir -p release-assets

          INSTALLER="$(find release-input/windows -type f -name "Nolane-AI-Personal-$VERSION-Setup.exe" -print -quit)"
          SOFTWARE_RECEIPT="$(find release-input/windows -type f -name 'software-release.json' -print -quit)"
          CLEAN_RECEIPT="$(find release-input/windows -type f -name 'windows-software-clean-install.json' -print -quit)"
          WINDOWS_SUMS="$(find release-input/windows -type f -name 'SHA256SUMS-WINDOWS.txt' -print -quit)"
          ANDROID_APK="$(find release-input/closure -type f -name "Nolane-v$VERSION-android-arm64.apk" -print -quit)"
          WINDOWS_NATIVE="$(find release-input/closure -type f -name "Nolane-v$VERSION-windows-native-court.exe" -print -quit)"
          CLOSURE_RECEIPT="$(find release-input/closure -type f -name 'v1-ci-closure.json' -print -quit)"

          for path in "$INSTALLER" "$SOFTWARE_RECEIPT" "$CLEAN_RECEIPT" "$WINDOWS_SUMS" "$ANDROID_APK" "$WINDOWS_NATIVE" "$CLOSURE_RECEIPT"; do
            if [ -z "$path" ] || [ ! -f "$path" ]; then
              echo "Required release asset missing: $path" >&2
              exit 1
            fi
          done

          cp "$INSTALLER" release-assets/
          cp "$SOFTWARE_RECEIPT" release-assets/
          cp "$CLEAN_RECEIPT" release-assets/
          cp "$WINDOWS_SUMS" release-assets/
          cp "$ANDROID_APK" release-assets/
          cp "$WINDOWS_NATIVE" release-assets/
          cp "$CLOSURE_RECEIPT" release-assets/

          python - <<PY
          from pathlib import Path
          import zipfile

          root = Path("release-input/closure")
          output = Path("release-assets/Nolane-AI-Personal-v${VERSION}-software-artifacts.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(root))
          PY

          (
            cd release-assets
            sha256sum               "Nolane-AI-Personal-$VERSION-Setup.exe"               "Nolane-v$VERSION-android-arm64.apk"               "Nolane-v$VERSION-windows-native-court.exe"               "Nolane-AI-Personal-v$VERSION-software-artifacts.zip"               software-release.json               windows-software-clean-install.json               v1-ci-closure.json               > SHA256SUMS-RELEASE.txt
          )

          QUALITY="$(jq -r '.conversation_quality_passed // 0' release-assets/windows-software-clean-install.json)"
          MODEL_REPO="$(jq -r '.model_repo' release-assets/software-release.json)"
          MODEL_FILE="$(jq -r '.model_filename' release-assets/software-release.json)"
          CLOSURE_STATUS="$(jq -r '.status' release-assets/v1-ci-closure.json)"

          if [ "$QUALITY" != "13" ]; then
            echo "Expected 13/13 conversation quality gates, got $QUALITY" >&2
            exit 1
          fi
          if [ "$CLOSURE_STATUS" != "READY_FOR_V1_0_CI_VERIFIED" ]; then
            echo "Unexpected closure status: $CLOSURE_STATUS" >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          # Nolane AI Personal v$VERSION

          This release promotes the evidence-verified Qwen3.5-2B production cortex.

          ## Windows
          - one-click NSIS installer: `Nolane-AI-Personal-$VERSION-Setup.exe`
          - bundled local runtime and prerequisites
          - model: `$MODEL_REPO`
          - GGUF: `$MODEL_FILE`
          - clean-install court: PASS
          - real conversation quality court: 13/13 PASS

          ## Android
          - arm64 product APK built by the same-SHA Product Client Court
          - Android emulator packaged local-chat restart court: PASS

          ## Release authority
          - commit: `$SHA`
          - V1 CI Closure: `$CLOSURE_STATUS`
          - same-SHA Product Client, Living Runtime, Neural Shadow and Platform Crash evidence: PASS

          The release does not claim universal physical-device battery, thermal, OEM or field-performance certification.
          EOF

      - name: Publish immutable GitHub release
        if: steps.meta.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}"             release-assets/*             --repo "$GITHUB_REPOSITORY"             --target "${{ steps.candidate.outputs.sha }}"             --title "Nolane AI Personal ${{ steps.meta.outputs.tag }}"             --notes-file release-notes.md

      - name: Verify published release target
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          SHA="${{ steps.candidate.outputs.sha }}"
          TARGET="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')"
          if [ "$TARGET" != "$SHA" ]; then
            echo "Published release target mismatch: $TARGET != $SHA" >&2
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
