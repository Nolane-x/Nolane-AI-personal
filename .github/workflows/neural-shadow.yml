name: Neural Shadow CI

on:
  push:
  pull_request:

jobs:
  neural-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          pytest -q
          tests/test_living_core_contracts.py
          tests/test_neural_shadow.py
          tests/test_surgery.py
          tests/test_surgery_candidate.py
          tests/test_surgery_court.py
      - run: python scripts/audit_living_core.py
